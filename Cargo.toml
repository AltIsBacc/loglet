[package]
name = "loglet"
authors = [ "AltIsBacc" ]
description = "A lightweight zero-heap logging library"

version = "0.0.2",
edition = "2024"

repository = "https://github.com/AltIsBacc/loglet"
license = "MIT"
readme = "README.md"

keywords = [ "logging", "log", "no-alloc", "cli" ]
categories = [ "development-tools::debugging" ]

exclude = [ ".github/*" ]

[dependencies]
owo-colors = { version = "4.3.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

